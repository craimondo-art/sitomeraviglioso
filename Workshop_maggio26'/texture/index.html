<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texture Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: none;
      border-radius: 60px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1b;
      min-width: 120px;
      justify-content: center;
    }

    .btn .color-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
      flex-shrink: 0;
    }

    .btn-scale {
      min-width: 200px;
      cursor: default;
    }

    .btn-scale input[type="range"] {
      flex: 1;
      min-width: 80px;
    }

    .btn-scale .scale-value {
      min-width: 28px;
      text-align: center;
      font-size: 13px;
    }

    input[type="color"] {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="textureCanvas"></canvas>

  <div class="controls" id="controls">
    <button class="btn" id="btnFill">
      Fill
      <span class="color-circle" id="fillCircle" style="background: #ffffff;"></span>
    </button>
    <input type="color" id="fillPicker" value="#ffffff">

    <button class="btn" id="btnStroke">
      Stroke
      <span class="color-circle" id="strokeCircle" style="background: #1d1d1b;"></span>
    </button>
    <input type="color" id="strokePicker" value="#1d1d1b">

    <div class="btn btn-scale" id="btnScale">
      <span class="scale-value" id="scaleLabel">1.0</span>
      <input type="range" id="scaleSlider" min="0.25" max="3" step="0.1" value="1">
    </div>
  </div>

  <script>
    // JS will be added in subsequent tasks
  </script>
</body>
</html>
