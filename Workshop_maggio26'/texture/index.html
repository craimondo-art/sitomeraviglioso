<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texture Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: none;
      border-radius: 60px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1b;
      min-width: 120px;
      justify-content: center;
    }

    .btn .color-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
      flex-shrink: 0;
    }

    .btn-scale {
      min-width: 200px;
      cursor: default;
    }

    .btn-scale input[type="range"] {
      flex: 1;
      min-width: 80px;
    }

    .btn-scale .scale-value {
      min-width: 28px;
      text-align: center;
      font-size: 13px;
    }

    input[type="color"] {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="textureCanvas"></canvas>

  <div class="controls" id="controls">
    <button class="btn" id="btnFill">
      Fill
      <span class="color-circle" id="fillCircle" style="background: #ffffff;"></span>
    </button>
    <input type="color" id="fillPicker" value="#ffffff">

    <button class="btn" id="btnStroke">
      Stroke
      <span class="color-circle" id="strokeCircle" style="background: #1d1d1b;"></span>
    </button>
    <input type="color" id="strokePicker" value="#1d1d1b">

    <div class="btn btn-scale" id="btnScale">
      <span class="scale-value" id="scaleLabel">1.0</span>
      <input type="range" id="scaleSlider" min="0.25" max="3" step="0.1" value="1">
    </div>
  </div>

  <script>
    const SVG_W = 20.82;
    const SVG_H = 46.92;

    const RAW_RECTS = [
      { x: 0.5,  y: 33.8,  w: 9.61, h: 3.49 },
      { x: 5.3,  y: 23.31, w: 8.77, h: 10.49 },
      { x: 9.22, y: 33.8,  w: 9.78, h: 12.63 },
      { x: 1.62, y: 24.7,  w: 3.65, h: 4.71 },
      { x: 2.91, y: 12.32, w: 2.39, h: 12.38 },
      { x: 5.3,  y: 0.5,   w: 8.77, h: 22.81 },
      { x: 14.11,y: 20.32, w: 6.21, h: 13.48 }
    ];

    const GAP = 1.5;

    function getGappedRects(rects, gap) {
      return rects.map(r => {
        const ix = Math.min(gap, r.w / 3);
        const iy = Math.min(gap, r.h / 3);
        return {
          x: r.x + ix,
          y: r.y + iy,
          w: r.w - 2 * ix,
          h: r.h - 2 * iy
        };
      }).filter(r => r.w > 0 && r.h > 0);
    }

    const state = {
      fill: '#ffffff',
      stroke: '#1d1d1b',
      scale: 1
    };

    const canvas = document.getElementById('textureCanvas');
    const ctx = canvas.getContext('2d');
    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d');

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }

    function render() {
      const scaledW = SVG_W * state.scale;
      const scaledH = SVG_H * state.scale;

      offscreen.width = Math.ceil(scaledW);
      offscreen.height = Math.ceil(scaledH);

      offCtx.clearRect(0, 0, offscreen.width, offscreen.height);

      offCtx.fillStyle = state.fill;
      getGappedRects(RAW_RECTS, GAP).forEach(r => {
        offCtx.fillRect(r.x * state.scale, r.y * state.scale, r.w * state.scale, r.h * state.scale);
      });

      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = state.stroke;
      ctx.fillRect(0, 0, w, h);

      for (let y = 0; y < h; y += scaledH) {
        for (let x = 0; x < w; x += scaledW) {
          ctx.drawImage(offscreen, x, y, scaledW, scaledH);
        }
      }
    }

    // --- Fill control ---
    const fillPicker = document.getElementById('fillPicker');
    const fillCircle = document.getElementById('fillCircle');
    const btnFill = document.getElementById('btnFill');

    btnFill.addEventListener('click', () => fillPicker.click());

    fillPicker.addEventListener('input', (e) => {
      state.fill = e.target.value;
      fillCircle.style.background = state.fill;
      render();
    });

    // --- Stroke control ---
    const strokePicker = document.getElementById('strokePicker');
    const strokeCircle = document.getElementById('strokeCircle');
    const btnStroke = document.getElementById('btnStroke');

    btnStroke.addEventListener('click', () => strokePicker.click());

    strokePicker.addEventListener('input', (e) => {
      state.stroke = e.target.value;
      strokeCircle.style.background = state.stroke;
      render();
    });

    // --- Scale control ---
    const scaleSlider = document.getElementById('scaleSlider');
    const scaleLabel = document.getElementById('scaleLabel');

    scaleSlider.addEventListener('input', (e) => {
      state.scale = parseFloat(e.target.value);
      scaleLabel.textContent = state.scale.toFixed(1);
      render();
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      render();
    });

    resizeCanvas();
    render();
  </script>
</body>
</html>
