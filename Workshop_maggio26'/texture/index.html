<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texture Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: none;
      border-radius: 60px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1b;
      min-width: 120px;
      justify-content: center;
      overflow: hidden;
    }

    .btn-color {
      cursor: pointer;
    }

    .btn-color input[type="color"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
    }

    .btn .color-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid #ccc;
      flex-shrink: 0;
      pointer-events: none;
    }

    .btn-range {
      min-width: 200px;
      cursor: default;
      padding: 12px 20px;
    }

    .btn-range input[type="range"] {
      flex: 1;
      min-width: 60px;
      cursor: pointer;
    }

    .btn-range .range-value {
      min-width: 28px;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <canvas id="textureCanvas"></canvas>

  <div class="controls" id="controls">
    <div class="btn btn-color" id="btnFill">
      Fill
      <span class="color-circle" id="fillCircle" style="background: #cccccc;"></span>
      <input type="color" id="fillPicker" value="#cccccc">
    </div>

    <div class="btn btn-color" id="btnStroke">
      Stroke
      <span class="color-circle" id="strokeCircle" style="background: #1d1d1b;"></span>
      <input type="color" id="strokePicker" value="#1d1d1b">
    </div>

    <div class="btn btn-range" id="btnScale">
      <span class="range-value" id="scaleLabel">1.0</span>
      <input type="range" id="scaleSlider" min="0.25" max="3" step="0.1" value="1">
    </div>

    <div class="btn btn-range" id="btnNoise">
      <span class="range-value" id="noiseLabel">0</span>
      <input type="range" id="noiseSlider" min="0" max="100" step="1" value="0">
    </div>
  </div>

  <script>
    const TILE_W = 100;
    const TILE_H = 100;

    const RECTS = [
      { x: 2,  y: 2,  w: 44, h: 44 },
      { x: 50, y: 2,  w: 20, h: 54 },
      { x: 74, y: 2,  w: 24, h: 24 },
      { x: 2,  y: 50, w: 44, h: 14 },
      { x: 74, y: 30, w: 24, h: 24 },
      { x: 50, y: 60, w: 20, h: 20 },
      { x: 2,  y: 68, w: 20, h: 30 },
      { x: 26, y: 78, w: 44, h: 14 },
      { x: 50, y: 84, w: 20, h: 14 },
      { x: 74, y: 58, w: 24, h: 40 },
      { x: 26, y: 96, w: 44, h: 2 },
    ];

    const state = {
      fill: '#cccccc',
      stroke: '#1d1d1b',
      scale: 1,
      noise: 0
    };

    const canvas = document.getElementById('textureCanvas');
    const ctx = canvas.getContext('2d');
    const offscreen = document.createElement('canvas');
    const offCtx = offscreen.getContext('2d');

    // --- Perlin Noise ---
    class PerlinNoise {
      constructor() {
        this.p = [];
        for (let i = 0; i < 256; i++) this.p[i] = i;
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
        }
        this.p = [...this.p, ...this.p];
      }

      fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      lerp(a, b, t) {
        return a + t * (b - a);
      }

      grad(hash, x, y) {
        const h = hash & 3;
        const u = h < 2 ? x : y;
        const v = h < 2 ? y : x;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
      }

      noise(x, y) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const xf = x - Math.floor(x);
        const yf = y - Math.floor(y);
        const u = this.fade(xf);
        const v = this.fade(yf);
        const aa = this.p[this.p[X] + Y];
        const ab = this.p[this.p[X] + Y + 1];
        const ba = this.p[this.p[X + 1] + Y];
        const bb = this.p[this.p[X + 1] + Y + 1];
        const x1 = this.lerp(this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf), u);
        const x2 = this.lerp(this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1), u);
        return this.lerp(x1, x2, v);
      }
    }

    const perlin = new PerlinNoise();
    let noisePattern = null;
    let noiseTime = 0;
    let animId = null;

    function buildNoisePattern() {
      const size = 256;
      const nc = document.createElement('canvas');
      nc.width = size;
      nc.height = size;
      const nctx = nc.getContext('2d');
      const imgData = nctx.createImageData(size, size);
      const d = imgData.data;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const n = perlin.noise(x * 0.08, y * 0.08);
          const idx = (y * size + x) * 4;
          const val = Math.round(128 + n * 128);
          d[idx] = val;
          d[idx + 1] = val;
          d[idx + 2] = val;
          d[idx + 3] = 128;
        }
      }
      nctx.putImageData(imgData, 0, 0);
      noisePattern = nctx.createPattern(nc, 'repeat');
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }

    function render() {
      const s = state.scale;
      const tileW = Math.ceil(TILE_W * s);
      const tileH = Math.ceil(TILE_H * s);

      offscreen.width = tileW;
      offscreen.height = tileH;

      offCtx.clearRect(0, 0, tileW, tileH);

      offCtx.fillStyle = state.fill;
      RECTS.forEach(r => {
        offCtx.fillRect(r.x * s, r.y * s, r.w * s, r.h * s);
      });

      const w = window.innerWidth;
      const h = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = state.stroke;
      ctx.fillRect(0, 0, w, h);

      for (let y = 0; y < h; y += tileH) {
        for (let x = 0; x < w; x += tileW) {
          ctx.drawImage(offscreen, x, y, tileW, tileH);
        }
      }

      if (state.noise > 0 && noisePattern) {
        ctx.save();
        ctx.globalAlpha = state.noise / 200;
        ctx.translate(noiseTime * 0.3, noiseTime * 0.2);
        ctx.fillStyle = noisePattern;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }
    }

    function tick() {
      if (state.noise > 0) {
        noiseTime++;
        render();
        animId = requestAnimationFrame(tick);
      } else {
        animId = null;
      }
    }

    function startNoiseAnim() {
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
      }
      if (state.noise > 0) {
        tick();
      }
    }

    const fillPicker = document.getElementById('fillPicker');
    const fillCircle = document.getElementById('fillCircle');
    fillPicker.addEventListener('input', (e) => {
      state.fill = e.target.value;
      fillCircle.style.background = state.fill;
      render();
    });

    const strokePicker = document.getElementById('strokePicker');
    const strokeCircle = document.getElementById('strokeCircle');
    strokePicker.addEventListener('input', (e) => {
      state.stroke = e.target.value;
      strokeCircle.style.background = state.stroke;
      render();
    });

    const scaleSlider = document.getElementById('scaleSlider');
    const scaleLabel = document.getElementById('scaleLabel');
    scaleSlider.addEventListener('input', (e) => {
      state.scale = parseFloat(e.target.value);
      scaleLabel.textContent = state.scale.toFixed(1);
      render();
    });

    const noiseSlider = document.getElementById('noiseSlider');
    const noiseLabel = document.getElementById('noiseLabel');
    noiseSlider.addEventListener('input', (e) => {
      state.noise = parseInt(e.target.value);
      noiseLabel.textContent = state.noise;
      startNoiseAnim();
      if (state.noise === 0) render();
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      render();
    });

    buildNoisePattern();
    resizeCanvas();
    render();
  </script>
</body>
</html>
