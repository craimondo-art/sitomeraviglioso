<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipografia Cinetica</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; }

.app { display: flex; width: 100%; height: 100vh; }
.scene-panel { flex: 1; height: 100%; }
.mixer-panel {
  width: 320px; min-width: 320px; height: 100%;
  background: #141414; border-left: 1px solid #2a2a2a;
  overflow-y: auto; padding: 14px;
}
.panel-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 14px; color: #888; }
.section-title { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; margin: 14px 0 8px; color: #555; }

.field { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 12px; color: #aaa; }
.field .label { width: 65px; flex-shrink: 0; }
.field input[type="range"] { flex: 1; height: 4px; accent-color: #ffd700; }
.field input[type="color"] { width: 30px; height: 22px; padding: 0; border: 1px solid #333; background: none; cursor: pointer; }
.field select { flex: 1; background: #1e1e1e; color: #e0e0e0; border: 1px solid #333; padding: 3px 6px; font-size: 12px; }
.text-input { flex: 1; background: #1e1e1e; color: #e0e0e0; border: 1px solid #333; padding: 5px 8px; font-size: 15px; font-family: inherit; }
.val { width: 36px; text-align: right; font-size: 11px; color: #666; }

.channel { background: #1a1a1a; border: 1px solid #222; border-radius: 5px; padding: 8px; margin-bottom: 6px; }
.channel.active { border-color: #ffd700; }
.channel-hdr { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.tog { padding: 2px 8px; border-radius: 3px; border: 1px solid; font-size: 10px; font-weight: 600; cursor: pointer; background: none; }
.tog.on { color: #ffd700; border-color: #ffd700; }
.tog.off { color: #555; border-color: #333; }
.ch-type { flex: 1; font-size: 12px; font-weight: 500; color: #ccc; }
.rm { background: none; border: none; color: #555; cursor: pointer; font-size: 13px; padding: 0 4px; }
.rm:hover { color: #f44; }

.add-bar { margin-top: 10px; }
.add-bar select { width: 100%; background: #1e1e1e; color: #e0e0e0; border: 1px dashed #444; padding: 7px; font-size: 12px; cursor: pointer; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #f44; color: #fff; padding: 10px 20px; border-radius: 6px; font-size: 13px; z-index: 100;
}

.ubtn { background: #1e1e1e; color: #ccc; border: 1px solid #333; padding: 3px 10px; font-size: 11px; cursor: pointer; border-radius: 3px; }
.ubtn:hover { border-color: #ffd700; color: #ffd700; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="app">
  <div class="scene-panel">
    <canvas id="c"></canvas>
  </div>
  <div class="mixer-panel" id="panel"></div>
</div>
<div id="toast" class="toast" style="display:none"></div>

<script>
// ─── State ───────────────────────────────────────────────────────
const S = {
  word: 'LUCE',
  master: 1,
  lights: [],
  nextId: 1,
  t: 0,
};
const MAX = 3;

// ─── Light factories ─────────────────────────────────────────────
const DEFAULTS = {
  fresnel:     { beamAngle: 45, softness: 0.5 },
  movinghead:  { beamAngle: 30, softness: 0.3, speed: 2 },
  gobo:        { beamAngle: 30, softness: 0.3, goboPattern: 'circle', goboRotation: 0, goboScale: 1, goboSVG: null },
  diffusore:   { spread: 5 },
  strobo:      { frequency: 5 },
};

function createLight(type) {
  const id = S.nextId++;
  return { id, type, active: false, color: '#ffffff', intensity: 0.5, x: 0, y: 3, z: 3, ...DEFAULTS[type] };
}

// ─── Canvas setup ─────────────────────────────────────────────────
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const off = document.createElement('canvas');
const octx = off.getContext('2d');

function resize() {
  const rect = c.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = rect.width * dpr;
  c.height = rect.height * dpr;
  c.style.width = rect.width + 'px';
  c.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);
  off.width = 256;
  off.height = 256;
}
window.addEventListener('resize', resize);
resize();

// ─── Gobo pattern generation ─────────────────────────────────────
function makeGoboTexture(pattern) {
  const size = 256;
  const cx = size/2, cy = size/2;
  octx.fillStyle = '#000';
  octx.fillRect(0, 0, size, size);
  octx.fillStyle = '#fff';

  switch (pattern) {
    case 'circle':
      octx.beginPath(); octx.arc(cx, cy, size*0.35, 0, Math.PI*2); octx.fill(); break;
    case 'star': {
      octx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = i*4*Math.PI/5 - Math.PI/2;
        const r = i%2 === 0 ? size*0.35 : size*0.15;
        octx.lineTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
      }
      octx.closePath(); octx.fill(); break;
    }
    case 'grid': {
      const s = size/8;
      for (let x = 0; x < size; x += s)
        for (let y = 0; y < size; y += s) octx.fillRect(x+2, y+2, s-4, s-4);
      break;
    }
    case 'diamond':
      octx.beginPath(); octx.moveTo(cx, cy-size*0.35); octx.lineTo(cx+size*0.35, cy);
      octx.lineTo(cx, cy+size*0.35); octx.lineTo(cx-size*0.35, cy); octx.closePath(); octx.fill(); break;
    case 'cross': {
      const w = size*0.08, h = size*0.35;
      octx.fillRect(cx-w/2, cy-h, w, h*2); octx.fillRect(cx-h, cy-w/2, h*2, w); break;
    }
    default:
      octx.beginPath(); octx.arc(cx, cy, size*0.35, 0, Math.PI*2); octx.fill();
  }
  return octx.getImageData(0, 0, size, size);
}

let _goboCache = {};
function getGoboPattern(name) {
  if (!_goboCache[name]) _goboCache[name] = makeGoboTexture(name);
  return _goboCache[name];
}

// ─── 3D to 2D mapping ────────────────────────────────────────────
let W, H;
function setDims() {
  const r = c.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
}

function lightPos(lx, ly) {
  return {
    px: W/2 + lx * (W * 0.07),
    py: H * 0.45 - (ly - 0.5) * ((H * 0.4) / 5.5),
  };
}

function beamRadius(angle, z) {
  const base = 40 + (angle / 80) * 250;
  const depth = 1 / (1 + z * 0.1);
  return base * depth;
}

// ─── Rendering ───────────────────────────────────────────────────
function render() {
  S.t += 0.016;
  setDims();

  const word = S.word || ' ';
  ctx.clearRect(0, 0, W, H);

  // 1. Background
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // 2. Stage floor
  const floorY = H * 0.68;
  const floorGrad = ctx.createLinearGradient(0, floorY - 20, 0, H);
  floorGrad.addColorStop(0, 'rgba(30,30,30,0)');
  floorGrad.addColorStop(0.3, 'rgba(30,30,30,0.6)');
  floorGrad.addColorStop(1, 'rgba(20,20,20,1)');
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, floorY - 20, W, H - floorY + 20);

  // Floor grid lines
  ctx.strokeStyle = 'rgba(60,60,60,0.2)';
  ctx.lineWidth = 1;
  for (let i = -5; i <= 5; i++) {
    const gx = W/2 + i * 30;
    ctx.beginPath(); ctx.moveTo(gx, floorY); ctx.lineTo(gx, H); ctx.stroke();
  }

  // 3. Active lights
  const active = S.lights.filter(l => l.active);

  // 3a. Shadows on floor
  for (const l of active) {
    const shadowAlpha = l.intensity * S.master * 0.3;
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
    cx = W/2 + l.x * 15;
    cy = floorY + 10;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 40 + beamRadius(l.beamAngle ?? 30, l.z) * 0.5, 12, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // 3b. Scene beam glows (behind word)
  for (const l of active) {
    const mi = S.master;
    const intens = l.intensity * mi;
    const { px, py } = lightPos(l.x, l.y);
    const r = beamRadius(l.beamAngle ?? 30, l.z) * 1.5;

    let isStroboOn = true;
    if (l.type === 'strobo') {
      const phase = Math.sin(S.t * l.frequency * Math.PI * 2);
      isStroboOn = phase > 0;
    }
    if (!isStroboOn) continue;

    const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
    const col = hexToRgb(l.color);
    grad.addColorStop(0, `rgba(${col.r},${col.g},${col.b},${intens * 0.15})`);
    grad.addColorStop(0.5, `rgba(${col.r},${col.g},${col.b},${intens * 0.06})`);
    grad.addColorStop(1, `rgba(${col.r},${col.g},${col.b},0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, floorY + 40);

    // Light beam cone visual
    ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},${intens * 0.08})`;
    ctx.lineWidth = 1;
    const centerX = W/2;
    const targetY = H * 0.45;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(centerX - r * 0.4, targetY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(centerX + r * 0.4, targetY); ctx.stroke();
  }

  // 4. Word
  const fontSize = Math.min(H * 0.15, W * 0.06);
  ctx.font = `bold ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(word).width;
  const wordX = W/2;
  const wordY = H * 0.45;

  // Draw word base
  ctx.fillStyle = '#555';
  ctx.fillText(word, wordX + 2, wordY + 2);
  ctx.fillStyle = '#aaa';
  ctx.fillText(word, wordX, wordY);

  // 5. Light effects on word using compositing
  // Save, draw word in white, then color with lights via source-atop
  ctx.save();
  // Draw word again as pure white for the light target
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff';
  ctx.fillText(word, wordX, wordY);

  // Now apply light colors onto the word using source-atop
  ctx.globalCompositeOperation = 'source-atop';
  for (const l of active) {
    const mi = S.master;
    const intens = l.intensity * mi;

    if (l.type === 'strobo') {
      const phase = Math.sin(S.t * l.frequency * Math.PI * 2);
      if (phase <= 0) continue;
    }

    const { px, py } = lightPos(l.x, l.y);
    const r = beamRadius(l.beamAngle ?? 30, l.z) * 0.8;
    const col = hexToRgb(l.color);
    const soft = l.softness ?? 0.3;

    if (l.type === 'gobo' && l.goboPattern) {
      // Gobo: draw pattern clipped to word
      const pattern = l.goboPattern === 'custom' && l.goboSVG
        ? null // SVG rendering would need img load - skip for simplicity
        : getGoboPattern(l.goboPattern);

      if (pattern) {
        // Create pattern clip
        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.clip();
        // Scale and rotate pattern onto the area
        const scale = l.goboScale ?? 1;
        const rot = (l.goboRotation ?? 0) * Math.PI / 180;
        const sx = px - r;
        const sy = py - r;
        ctx.translate(px, py);
        ctx.rotate(rot);
        ctx.scale(scale, scale);
        ctx.translate(-px, -py);
        ctx.putImageData(pattern, px - 128, py - 128);
        ctx.restore();
      }
    } else {
      // Fresnel style gradient on word
      const grad = ctx.createRadialGradient(px, py, 0, px, py, r);
      const innerStop = Math.max(0.5, 1 - soft);
      grad.addColorStop(0, `rgba(${col.r},${col.g},${col.b},${intens * 0.9})`);
      grad.addColorStop(innerStop, `rgba(${col.r},${col.g},${col.b},${intens * 0.5})`);
      grad.addColorStop(1, `rgba(${col.r},${col.g},${col.b},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
  }

  ctx.globalCompositeOperation = 'source-over';

  // Add a soft glow highlight on the word
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillText(word, wordX, wordY);

  ctx.restore();

  // 6. Moving head animation update
  for (const l of S.lights) {
    if (l.type === 'movinghead' && l.active) {
      // Position is already stored, but the visual movement
      // is done in render via the state's x,y which get updated
    }
  }

  // Gobo rotation animation (if active)
  // handled by control panel updating the state

  requestAnimationFrame(render);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return { r, g, b };
}

// ─── Control Panel ───────────────────────────────────────────────
const panel = document.getElementById('panel');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
}

const LIGHT_TYPES = [
  { v: 'fresnel', l: 'Fresnel' },
  { v: 'movinghead', l: 'Moving Head' },
  { v: 'gobo', l: 'Gobo' },
  { v: 'diffusore', l: 'Diffusore' },
  { v: 'strobo', l: 'Strobo' },
];

function renderPanel() {
  panel.innerHTML = '';

  const title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = '🎛 REGIA LUCI';
  panel.appendChild(title);

  // Master Control
  const mc = document.createElement('div');

  const sec = document.createElement('div');
  sec.className = 'section-title';
  sec.textContent = 'MASTER';
  mc.appendChild(sec);

  // Word
  const f1 = field('Parola', createInput('text', S.word, v => { S.word = v; }));
  mc.appendChild(f1);

  // Master intensity
  const f2 = field('Intensità', createSlider(0, 1, 0.01, S.master, v => { S.master = v; renderPanel(); }));
  mc.appendChild(f2);

  panel.appendChild(mc);

  // Channels
  const chSec = document.createElement('div');
  chSec.className = 'section-title';
  chSec.textContent = 'CANALI';
  panel.appendChild(chSec);

  for (const l of S.lights) {
    panel.appendChild(renderChannel(l));
  }

  // Add light
  const ab = document.createElement('div');
  ab.className = 'add-bar';
  const sel = document.createElement('select');
  const defOpt = document.createElement('option');
  defOpt.value = '';
  defOpt.disabled = true;
  defOpt.selected = true;
  defOpt.textContent = '+ Aggiungi luce';
  sel.appendChild(defOpt);
  for (const t of LIGHT_TYPES) {
    const opt = document.createElement('option');
    opt.value = t.v;
    opt.textContent = t.l;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => {
    if (sel.value) addLight(sel.value);
    sel.value = '';
  });
  ab.appendChild(sel);
  panel.appendChild(ab);
}

function addLight(type) {
  if (S.lights.length >= MAX) {
    showToast("Limite massimo 3 luci raggiunto. Disattivane una prima di aggiungerne un'altra.");
    return;
  }
  S.lights.push(createLight(type));
  renderPanel();
}

function removeLight(id) {
  S.lights = S.lights.filter(l => l.id !== id);
  renderPanel();
}

function toggleLight(id) {
  const l = S.lights.find(l => l.id === id);
  if (!l) return;
  const next = !l.active;
  if (next && S.lights.filter(x => x.active && x.id !== id).length >= MAX) {
    showToast("Limite massimo 3 luci raggiunto. Disattivane una prima di attivarne un'altra.");
    return;
  }
  l.active = next;
  renderPanel();
}

function updateLight(id, patch) {
  const l = S.lights.find(l => l.id === id);
  if (l) Object.assign(l, patch);
}

function renderChannel(l) {
  const ch = document.createElement('div');
  ch.className = 'channel' + (l.active ? ' active' : '');

  const hdr = document.createElement('div');
  hdr.className = 'channel-hdr';

  const tog = document.createElement('button');
  tog.className = 'tog ' + (l.active ? 'on' : 'off');
  tog.textContent = l.active ? 'ON' : 'OFF';
  tog.addEventListener('click', () => toggleLight(l.id));
  hdr.appendChild(tog);

  const typ = document.createElement('span');
  typ.className = 'ch-type';
  typ.textContent = LIGHT_TYPES.find(t => t.v === l.type)?.l || l.type;
  hdr.appendChild(typ);

  const rm = document.createElement('button');
  rm.className = 'rm';
  rm.textContent = '✕';
  rm.addEventListener('click', () => removeLight(l.id));
  hdr.appendChild(rm);

  ch.appendChild(hdr);

  // Common controls
  ch.appendChild(field('Colore', createColorPicker(l.color, v => { updateLight(l.id, { color: v }); renderPanel(); })));
  ch.appendChild(field('Intensità', createSlider(0, 1, 0.01, l.intensity, v => { updateLight(l.id, { intensity: v }); renderPanel(); }), Math.round(l.intensity * 100) + '%'));
  ch.appendChild(field('Pos X', createSlider(-4, 4, 0.1, l.x, v => { updateLight(l.id, { x: v }); })));
  ch.appendChild(field('Pos Y', createSlider(0.5, 6, 0.1, l.y, v => { updateLight(l.id, { y: v }); })));
  ch.appendChild(field('Pos Z', createSlider(1, 8, 0.1, l.z, v => { updateLight(l.id, { z: v }); })));
  ch.appendChild(field('Beam', createSlider(10, 80, 1, l.beamAngle ?? 30, v => { updateLight(l.id, { beamAngle: v }); }), (l.beamAngle ?? 30) + '°'));
  ch.appendChild(field('Soft', createSlider(0, 1, 0.01, l.softness ?? 0.3, v => { updateLight(l.id, { softness: v }); })));

  // Type-specific controls
  if (l.type === 'movinghead') {
    ch.appendChild(field('Speed', createSlider(0.5, 5, 0.1, l.speed, v => { updateLight(l.id, { speed: v }); })));
  }
  if (l.type === 'gobo') {
    const sel = document.createElement('select');
    for (const p of ['circle', 'star', 'grid', 'diamond', 'cross']) {
      const o = document.createElement('option');
      o.value = p; o.textContent = p;
      if (p === l.goboPattern) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => {
      updateLight(l.id, { goboPattern: sel.value, goboSVG: null });
      _goboCache = {};
      renderPanel();
    });
    ch.appendChild(field('Pattern', sel));

    ch.appendChild(field('Rotaz.', createSlider(0, 360, 1, l.goboRotation, v => { updateLight(l.id, { goboRotation: v }); })));
    ch.appendChild(field('Scala', createSlider(0.5, 3, 0.1, l.goboScale, v => { updateLight(l.id, { goboScale: v }); })));

    // SVG upload
    const fu = document.createElement('input');
    fu.type = 'file';
    fu.accept = '.svg';
    fu.style.display = 'none';
    fu.addEventListener('change', () => {
      const file = fu.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        updateLight(l.id, { goboPattern: 'custom', goboSVG: ev.target.result });
        renderPanel();
      };
      reader.readAsDataURL(file);
    });
    const ub = document.createElement('button');
    ub.className = 'ubtn';
    ub.textContent = 'Carica SVG';
    ub.addEventListener('click', () => fu.click());
    ch.appendChild(field('SVG', ub));
    ch.appendChild(fu);
  }
  if (l.type === 'strobo') {
    ch.appendChild(field('Freq.', createSlider(1, 20, 1, l.frequency, v => { updateLight(l.id, { frequency: v }); }), l.frequency + ' Hz'));
  }
  if (l.type === 'diffusore') {
    ch.appendChild(field('Spread', createSlider(1, 10, 0.5, l.spread, v => { updateLight(l.id, { spread: v }); })));
  }

  // Moving head animation: update x,y over time
  if (l.type === 'movinghead' && l.active) {
    const speed = l.speed ?? 2;
    l.x = (l._baseX ?? 0) + Math.sin(S.t * speed * 1.3) * 2;
    l.y = (l._baseY ?? 3) + Math.cos(S.t * speed * 0.7) * 1.5;
  }

  return ch;
}

// ─── UI helpers ───────────────────────────────────────────────────
function field(label, el, extra) {
  const d = document.createElement('div');
  d.className = 'field';
  const sp = document.createElement('span');
  sp.className = 'label';
  sp.textContent = label;
  d.appendChild(sp);
  d.appendChild(el);
  if (extra) {
    const v = document.createElement('span');
    v.className = 'val';
    v.textContent = extra;
    d.appendChild(v);
  }
  return d;
}

function createInput(type, val, cb) {
  const el = document.createElement('input');
  el.className = 'text-input';
  el.type = type;
  el.value = val;
  el.addEventListener('input', () => cb(el.value));
  return el;
}

function createSlider(min, max, step, val, cb) {
  const el = document.createElement('input');
  el.type = 'range';
  el.min = min; el.max = max; el.step = step;
  el.value = val;
  el.addEventListener('input', () => cb(Number(el.value)));
  return el;
}

function createColorPicker(val, cb) {
  const el = document.createElement('input');
  el.type = 'color';
  el.value = val;
  el.addEventListener('input', () => cb(el.value));
  return el;
}

// ─── Init ─────────────────────────────────────────────────────────
renderPanel();
render();
</script>
</body>
</html>
