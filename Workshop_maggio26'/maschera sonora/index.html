<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maschera Sonora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <svg id="mask" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 663.49 848.48">
      <defs>
        <style>
          .cls-1 { fill: #ffabe5; }
          .cls-2 { fill: #e82e89; }
        </style>
      </defs>
    </svg>
    <div id="controls">
      <div id="controls-row">
        <div id="controls-left">
          <label for="soglia">Soglia: <span id="soglia-value">0.30</span></label>
          <input type="range" id="soglia" min="0.05" max="1.0" step="0.01" value="0.30">
          <div id="volume-bar-container">
            <div id="volume-bar"></div>
          </div>
        </div>
        <button id="mic-btn" aria-label="Toggle microphone">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="flubber.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
