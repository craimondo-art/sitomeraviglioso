<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight Word Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;500;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #ccc; font-family: 'Roboto Condensed', sans-serif; }

.app { display: flex; width: 100%; height: 100vh; }
.scene-panel { flex: 0 0 800px; width: 800px; height: 800px; }
.mixer-panel {
  flex: 1; height: 100%;
  background: #111; border-left: 1px solid #222;
  overflow-y: auto; padding: 12px;
}
.panel-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; color: #666; }
.section-title { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1.5px; margin: 12px 0 6px; color: #444; }

.field { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; color: #888; }
.field .label { width: 60px; flex-shrink: 0; }
.field input[type="range"] { flex: 1; height: 3px; accent-color: #e82e89; }
.field input[type="color"] { width: 26px; height: 20px; padding: 0; border: 1px solid #333; background: none; cursor: pointer; }
.text-input { flex: 1; background: #1a1a1a; color: #e0e0e0; border: 1px solid #333; padding: 4px 8px; font-size: 14px; font-family: inherit; }
.val { width: 32px; text-align: right; font-size: 10px; color: #555; }

.channel { background: #181818; border: 1px solid #222; border-radius: 4px; padding: 6px; margin-bottom: 4px; }
.channel.active { border-color: #e82e89; }
.channel-hdr { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.tog { padding: 1px 6px; border-radius: 3px; border: 1px solid; font-size: 9px; font-weight: 600; cursor: pointer; background: none; }
.tog.on { color: #e82e89; border-color: #e82e89; }
.tog.off { color: #555; border-color: #333; }
.ch-num { flex: 1; font-size: 11px; font-weight: 500; color: #999; }
.rm { background: none; border: none; color: #555; cursor: pointer; font-size: 12px; padding: 0 4px; }
.rm:hover { color: #f44; }

.add-btn {
  display: block; width: 100%; margin-top: 8px;
  background: #1a1a1a; color: #888; border: 1px dashed #333;
  padding: 6px; font-size: 11px; cursor: pointer; text-align: center; border-radius: 3px;
}
.add-btn:hover { border-color: #e82e89; color: #e82e89; }

canvas { display: block; width: 800px; height: 800px; }
</style>
</head>
<body>
<div class="app">
  <div class="scene-panel">
    <canvas id="c" width="800" height="800"></canvas>
  </div>
  <div class="mixer-panel" id="panel"></div>
</div>
<script>
const S = {
  word: 'LUCE',
  spotlights: [],
  nextId: 1,
};

const W = 800;
const H = 800;

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const tmp = document.createElement('canvas');
tmp.width = W;
tmp.height = H;
const tc = tmp.getContext('2d');
const mask = document.createElement('canvas');
mask.width = W;
mask.height = H;
const mc = mask.getContext('2d');

function createSpotlight() {
  const id = S.nextId++;
  const angle = Math.random() * Math.PI * 2;
  return {
    id, active: true, color: '#ffffff', softness: 0.5, speed: 0.5, wander: 0.5,
    x: 0.5, y: 0.5,
    vx: Math.cos(angle), vy: Math.sin(angle),
    radius: 120,
  };
}

function addSpotlight() {
  S.spotlights.push(createSpotlight());
  renderPanel();
}

function removeSpotlight(id) { S.spotlights = S.spotlights.filter(s => s.id !== id); renderPanel(); }
function toggleSpotlight(id) { const s = S.spotlights.find(s => s.id === id); if (s) s.active = !s.active; renderPanel(); }
function updateSpotlight(id, p) { const s = S.spotlights.find(s => s.id === id); if (s) Object.assign(s, p); }

function updateMovement() {
  for (const s of S.spotlights) {
    if (!s.active) continue;

    // Wander: random rotation of velocity direction
    const wa = (Math.random() - 0.5) * s.wander * 0.4;
    const c = Math.cos(wa);
    const t = Math.sin(wa);
    const vx2 = s.vx * c - s.vy * t;
    const vy2 = s.vx * t + s.vy * c;
    s.vx = vx2;
    s.vy = vy2;

    // Normalize to maintain consistent direction magnitude
    const len = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    if (len > 0) { s.vx /= len; s.vy /= len; }

    // Move: speed maps to 0-5 pixels per frame on 800px canvas
    const px = s.speed * 5;
    s.x += s.vx * (px / W);
    s.y += s.vy * (px / H);

    // Bounce off canvas edges (margin keeps circle mostly visible)
    const m = 0.08;
    if (s.x < m) { s.x = m + (m - s.x); s.vx = -s.vx; }
    if (s.x > 1 - m) { s.x = 1 - m - (s.x - (1 - m)); s.vx = -s.vx; }
    if (s.y < m) { s.y = m + (m - s.y); s.vy = -s.vy; }
    if (s.y > 1 - m) { s.y = 1 - m - (s.y - (1 - m)); s.vy = -s.vy; }
  }
}

function render() {
  updateMovement();
  const word = S.word || ' ';
  const fontSize = Math.min(H * 0.18, W * 0.08);

  // 1. Black background
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const active = S.spotlights.filter(s => s.active);
  if (active.length === 0) { requestAnimationFrame(render); return; }

  // 2. For each spotlight: draw word colored, clipped to spotlight circle
  for (const s of active) {
    const px = s.x * W;
    const py = s.y * H;
    const r = s.radius;
    const col = hexToRgb(s.color);
    const innerStop = Math.max(0, 1 - s.softness * 0.8);

    // Clear temp canvas
    tc.clearRect(0, 0, W, H);

    // Draw the spotlight gradient mask
    mc.clearRect(0, 0, W, H);
    const g = mc.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(innerStop, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    mc.fillStyle = g;
    mc.beginPath();
    mc.arc(px, py, r, 0, Math.PI * 2);
    mc.fill();

    // Draw the word in the spotlight color on temp canvas
    tc.font = `bold ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
    tc.textAlign = 'center';
    tc.textBaseline = 'middle';
    tc.fillStyle = `rgb(${col.r},${col.g},${col.b})`;
    tc.fillText(word, W / 2, H / 2);

    // Clip word to spotlight circle using gradient mask
    tc.globalCompositeOperation = 'destination-in';
    tc.drawImage(mask, 0, 0);
    tc.globalCompositeOperation = 'source-over';

    // Draw onto main canvas
    ctx.drawImage(tmp, 0, 0);
  }

  requestAnimationFrame(render);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return { r, g, b };
}

const panel = document.getElementById('panel');

function renderPanel() {
  panel.innerHTML = '';
  const t = document.createElement('div'); t.className = 'panel-title'; t.textContent = 'SPOTLIGHT'; panel.appendChild(t);
  panel.appendChild(field('Parola', createInput('text', S.word, v => { S.word = v; })));
  const sec = document.createElement('div'); sec.className = 'section-title'; sec.textContent = 'CANALI'; panel.appendChild(sec);
  for (const s of S.spotlights) panel.appendChild(renderChannel(s));
  const b = document.createElement('button'); b.className = 'add-btn'; b.textContent = '+ Aggiungi spotlight';
  b.addEventListener('click', addSpotlight); panel.appendChild(b);
}

function renderChannel(s) {
  const ch = document.createElement('div');
  ch.className = 'channel' + (s.active ? ' active' : '');
  const hdr = document.createElement('div'); hdr.className = 'channel-hdr';
  const tog = document.createElement('button');
  tog.className = 'tog ' + (s.active ? 'on' : 'off');
  tog.textContent = s.active ? 'ON' : 'OFF';
  tog.addEventListener('click', () => toggleSpotlight(s.id));
  hdr.appendChild(tog);
  const num = document.createElement('span'); num.className = 'ch-num'; num.textContent = 'Spot ' + s.id; hdr.appendChild(num);
  const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = '✕';
  rm.addEventListener('click', () => removeSpotlight(s.id)); hdr.appendChild(rm);
  ch.appendChild(hdr);
  ch.appendChild(field('Colore', createColorPicker(s.color, v => { updateSpotlight(s.id, { color: v }); renderPanel(); })));
  ch.appendChild(field('Softness', createSlider(0, 1, 0.01, s.softness, v => { updateSpotlight(s.id, { softness: v }); }), s.softness.toFixed(2)));
  ch.appendChild(field('Speed', createSlider(0, 1, 0.01, s.speed, v => { updateSpotlight(s.id, { speed: v }); }), s.speed.toFixed(2)));
  ch.appendChild(field('Wander', createSlider(0, 1, 0.01, s.wander, v => { updateSpotlight(s.id, { wander: v }); }), s.wander.toFixed(2)));
  return ch;
}

function field(l, el, e) {
  const d = document.createElement('div'); d.className = 'field';
  const sp = document.createElement('span'); sp.className = 'label'; sp.textContent = l; d.appendChild(sp); d.appendChild(el);
  if (e !== undefined) { const v = document.createElement('span'); v.className = 'val'; v.textContent = e; d.appendChild(v); }
  return d;
}
function createInput(t, v, cb) { const e = document.createElement('input'); e.className = 'text-input'; e.type = t; e.value = v; e.addEventListener('input', () => cb(e.value)); return e; }
function createSlider(min, max, step, v, cb) { const e = document.createElement('input'); e.type = 'range'; e.min = min; e.max = max; e.step = step; e.value = v; e.addEventListener('input', () => cb(Number(e.value))); return e; }
function createColorPicker(v, cb) { const e = document.createElement('input'); e.type = 'color'; e.value = v; e.addEventListener('input', () => cb(e.value)); return e; }

addSpotlight();
renderPanel();
render();
</script>
</body>
</html>
