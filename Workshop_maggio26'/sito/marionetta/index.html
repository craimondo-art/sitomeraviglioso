<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Tool — Hand Pose</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="main-area">
      <canvas id="star-canvas"></canvas>
      <div id="webcam-box">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>
    <div id="console">
      <label class="color-pick">Color <span class="color-circle" id="star-circle"></span><input type="color" id="star-color" value="#e82e89"></label>
      <label class="color-pick">Bg <span class="color-circle" id="bg-circle"></span><input type="color" id="bg-color" value="#000000"></label>
      <label>Points <input type="range" id="star-points" min="3" max="12" value="5"><span id="points-label">5</span></label>
      <label><input type="checkbox" id="star-filled" checked> Filled</label>
      <label>Stroke <input type="range" id="stroke-width" min="1" max="20" value="3" disabled></label>
      <label>Webcam <input type="checkbox" id="cam-toggle" checked></label>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection"></script>

  <script src="script.js"></script>
</body>
</html>
