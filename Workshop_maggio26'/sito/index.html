<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarissa Raimondo — Esplorazioni con LLM</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="hero" class="full">
    <h1>Clarissa Raimondo</h1>
    <h2>Esplorazioni con LLM</h2>
  </div>

  <div id="gallery">
    <div id="carousel">
      <div id="track"></div>
      <div id="carousel-nav">
        <div id="zone-prev"><span class="arrow-btn">&#8592;</span></div>
        <div id="zone-open"></div>
        <div id="zone-next"><span class="arrow-btn">&#8594;</span></div>
      </div>
      <div id="dots"></div>
    </div>
  </div>

  <div id="marquee">
    <div id="marquee-track">
      <span>WORKSHOP DI INTERACTION DESIGN ABADIR A.A 25'/26'</span>
    </div>
  </div>

  <div id="project-view">
    <a id="btn-torna" href="#">&#8592; Torna alla Home</a>
    <iframe id="project-iframe" frameborder="0" allow="camera; microphone"></iframe>
  </div>

  <script src="script.js"></script>
</body>
</html>
